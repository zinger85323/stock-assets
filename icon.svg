<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2130"/><stop offset="1" stop-color="#0B0E15"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A6F"/><stop offset="1" stop-color="#E5383F"/>
    </linearGradient>
    <linearGradient id="dn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FD6A0"/><stop offset="1" stop-color="#169B6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#4C7DFF" stop-opacity="0.28"/><stop offset="1" stop-color="#4C7DFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="512" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g clip-path="url(#c)" fill="none" stroke="#6C8CFF" stroke-linecap="round">
    <circle cx="70" cy="452" r="130" stroke-opacity="0.22" stroke-width="3"/>
    <circle cx="70" cy="452" r="230" stroke-opacity="0.16" stroke-width="3"/>
    <circle cx="70" cy="452" r="330" stroke-opacity="0.10" stroke-width="3"/>
    <path d="M70 452 L330 192" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 12"/>
  </g>
  <!-- candles -->
  <g stroke-linecap="round">
    <line x1="150" y1="300" x2="150" y2="404" stroke="#169B6B" stroke-width="10"/>
    <rect x="124" y="326" width="52" height="56" rx="10" fill="url(#dn)"/>
    <line x1="238" y1="250" x2="238" y2="384" stroke="#E5383F" stroke-width="10"/>
    <rect x="212" y="282" width="52" height="72" rx="10" fill="url(#up)"/>
    <line x1="326" y1="190" x2="326" y2="332" stroke="#E5383F" stroke-width="10"/>
    <rect x="300" y="214" width="52" height="86" rx="10" fill="url(#up)"/>
    <line x1="414" y1="108" x2="414" y2="284" stroke="#E5383F" stroke-width="10"/>
    <rect x="388" y="136" width="52" height="116" rx="10" fill="url(#up)"/>
  </g>
  <!-- radar ping on the top candle -->
  <circle cx="414" cy="108" r="26" fill="none" stroke="#FFD166" stroke-width="6" stroke-opacity="0.95"/>
  <circle cx="414" cy="108" r="11" fill="#FFD166"/>
